name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate release resources
        run: |
          plutil -lint Chromafield/Resources/PrivacyInfo.xcprivacy
          plutil -lint ExportOptions.plist
          jq -s -e 'length == 6' Chromafield/Resources/Presets/*.json >/dev/null
      - name: Build release configuration
        run: |
          xcodebuild build \
            -scheme Chromafield \
            -project Chromafield.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcodebuild test \
            -scheme Chromafield \
            -project Chromafield.xcodeproj \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            CODE_SIGNING_ALLOWED=NO
